name: Update Papers

# Run on schedule (every day at midnight UTC) and allow manual dispatch
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-papers:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # Install required Python packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # Run your Python update script
      - name: Run update script
        run: python myupdate_papers.py

      # Configure git (adjust the email and name as needed)
      - name: Configure Git
        run: |
          git config --global user.email "etlee110@gmail.com"
          git config --global user.name "Ethan Lee"

      # Commit any changes (if the _includes/homework_papers.html file was updated)
      - name: Commit changes
        run: |
          git add _includes/homework_papers.html
          # Check if there are changes. If so, commit them.
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update papers $(date -u +"%Y-%m-%d %H:%M:%S") UTC"
          else
            echo "No changes to commit."
          fi

      # Push the changes back to the repository
      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}