name: Update ArXiv Papers

on:
  schedule:
    - cron: '0 0 1 * *'  # Runs every day at midnight UTC
  workflow_dispatch:   # Allows manual trigger

jobs:
  update-papers:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout gh-pages branch
      uses: actions/checkout@v3
      with:
        ref: gh-pages

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: pip install requests

    - name: Run script to update papers
      run: python update_papers.py

    - name: List directory for debugging
      run: ls -la courses/BST236ComputingI

    - name: Update timestamp in BST236_HW1.html
      run: |
        timestamp=$(date '+%Y-%m-%d %H:%M:%S')
        echo "Updating courses/BST236ComputingI/BST236_HW1.html with timestamp: $timestamp"
        # Replace the line starting with "Last updated:" with the new timestamp.
        sed -i "s|Last updated:.*|Last updated: $timestamp|g" courses/BST236ComputingI/BST236_HW1.html

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add _includes/homework_papers.html courses/BST236ComputingI/BST236_HW1.html
        git commit -m "Auto-update arXiv papers" || echo "No changes to commit"
        git push origin gh-pages
