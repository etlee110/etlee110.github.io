name: Update ArXiv Papers

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at midnight UTC every day
  workflow_dispatch:  # Allows manual triggering

jobs:
  update-papers:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: pip install requests

    - name: Run script to update papers
      run: python update_papers.py  # Ensure this script is correctly named in your repo

    - name: Commit and push if changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add _includes/homework_papers.html
        git commit -m "Auto-update arXiv papers" || exit 0  # Prevent failure if no changes
        git push origin gh-pages