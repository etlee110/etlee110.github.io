name: Fetch MLB Standings

on:
  schedule:
    # Runs daily at 12:00 PM UTC
    - cron: "0 12 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch_standings:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - uses: actions/checkout@v3
 
      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
 
      # Install dependencies
      - name: Install dependencies
        run: pip install requests
 
      # Run the script
      - name: Fetch MLB Standings
        run: python fetch_mlb_standings.py

      # Commit changes
      - name: Commit Standings
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          git add mlb_standings.json
          git commit -m "Automated update: MLB Standings [$(date)]"
          git push
