name: Fetch MLB Home Runs

on:
  schedule:
    - cron: "0 16 * * *"  # 12 PM ET (UTC-4 during MLB season)
  workflow_dispatch:      # allow manual trigger

jobs:
  fetch-homers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch home run data
        run: python fetch_homers.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/home_runs.json
          git commit -m "Auto-update MLB home runs" || echo "No changes to commit"
          git push origin gh-pages
