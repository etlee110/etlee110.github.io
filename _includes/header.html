<header class="d-flex flex-column align-items-center pb-3 mb-5 border-bottom">
  <div class="text-center">
    <a href="{{ site.github.url }}/" class="d-flex align-items-center text-decoration-none">
      <span class="fs-4 fw-bold">{{ site.title }}</span>
    </a>
    <a href="{{ site.github.url }}/" class="d-flex align-items-center text-decoration-none">
      <span>{{ site.description }}</span>
    </a>
  </div>
  <nav class="mt-3">
    <ul class="nav justify-content-center">
      {% for item in site.data.settings.menu %}
        <li class="nav-item">
          <a class="nav-link text-decoration-none" href="{{ site.github.url }}{{ item.url }}">{{ item.name }}</a>
        </li>
      {% endfor %}
    </ul>
  </nav>
</header>
